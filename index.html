<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="reset.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" crossorigin="anonymous"></script>
    <title>QB-Multicharacter</title>
</head>
<body>
<div class="container">
    <div class="main-screen">

        <!-- Animated background canvas -->
        <canvas id="bg-canvas"></canvas>
        <div class="bg-overlay"></div>

        <!-- Split bars animation (original mechanic kept) -->
        <div class="topbar"></div>
        <div class="bottombar"></div>
        <div class="fondocolor"></div>

        <!-- ── WELCOME / LOADING SCREEN ─────────── -->
        <div class="welcomescreen">
            <div class="loading-rondje">
                <div class="lds-ring">
                    <svg class="ring-svg" viewBox="0 0 80 80">
                        <circle class="ring-track" cx="40" cy="40" r="32"></circle>
                        <circle class="ring-arc"   cx="40" cy="40" r="32"></circle>
                    </svg>
                </div>
                <p id="loading-text">Kraunami veikėjai</p>
            </div>
        </div>

        <!-- ── TITLE / START SCREEN ──────────────── -->
        <div class="title-screen">
            <div class="fondo-negro"></div>
            <div class="contenedor">
                <div class="imagenlogo">
                    <span class="logo-farai">FARAI</span><span class="logo-rp">RP</span>
                    <div class="logo-sub">Roleplay Serveris</div>
                </div>
                <div class="btn-iniciar">
                    <span>ĮEITI Į SERVERĮ</span>
                    <i class="fa fa-chevron-right"></i>
                </div>
            </div>
        </div>

        <!-- ── CHARACTERS LIST ───────────────────── -->
        <div class="characters-list"></div>

        <!-- ── CHARACTER INFO PANEL ──────────────── -->
        <div class="character-info">
            <div class="char-info-titel">
                <i class="material-icons" id="char-info-icon">info</i>
                <span id="char-info-titel">Veikėjo informacija</span>
            </div>
            <div class="character-info-valid">
                <span id="no-char">Pasirink veikėjo vietą, kad matytum informaciją.</span>
            </div>
        </div>

        <!-- ── CREATE CHARACTER FORM ─────────────── -->
        <div class="character-register">
            <div class="characters-register-block-header">
                <p>Naujas veikėjas</p>
                <button type="button" class="close-reg-btn" id="close-reg" aria-label="Uždaryti veikėjo kūrimą">×</button>
            </div>
            <div class="char-register-inputs">
                <input type="text"  id="first_name"   placeholder="Vardas"   class="char-reg-input">
                <input type="text"  id="last_name"    placeholder="Pavardė"    class="char-reg-input">
                <input type="text"  id="nationality"  placeholder="Tautybė"  class="char-reg-input">
                <input type="date"  id="birthdate"    placeholder="Gimimo data"   min="1900-01-01" max="2999-12-31" class="char-reg-input">
                <select id="gender" name="gender">
                    <option value="Male" selected>Vyras</option>
                    <option value="Female">Moteris</option>
                </select>
            </div>
            <div class="character-reg-btn" id="create">
                <p id="create-text">Patvirtinti</p>
            </div>
        </div>

        <!-- ── DELETE CONFIRMATION ───────────────── -->
        <div class="character-delete">
            <div class="characters-delete-block-header">
                <p>Ištrinti veikėją</p>
            </div>
            <p class="delete-warning">Ar tikrai nori ištrinti šį veikėją? Šio veiksmo atšaukti negalima.</p>
            <div class="delete-actions">
                <div class="character-canceldel-btn" id="cancel-delete"><p id="cancel-text">Atšaukti</p></div>
                <div class="character-acceptdel-btn" id="accept-delete"><p id="accept-text">Ištrinti</p></div>
            </div>
        </div>

    </div>
</div>

<!-- Audio elements (kept for JS compatibility) -->
<audio id="musica_fondo" loop src=""></audio>
<audio id="click" src=""></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script type="text/javascript" src="profanity.js"></script>
<script type="text/javascript" src="bg.js"></script>
<script type="text/javascript" src="script.js"></script>
</body>
</html>
